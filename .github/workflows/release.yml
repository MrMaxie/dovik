name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  source:
    name: Verify tagged source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4.2.3
      - id: version
        shell: bash
        run: |
          version=$(go run ./cmd/dovik --version | awk '{print $2}')
          test "v$version" = "$GITHUB_REF_NAME"
          grep -F "## [$version]" CHANGELOG.md
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          test "$GITHUB_SHA" = "$(git rev-parse origin/master)"
          test -z "$(npx --yes @fission-ai/openspec@1.5.0 list --json | jq -r '.changes[]?.name')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: just release-source-check

  artifacts:
    name: Release artifact (${{ matrix.target }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            extension: zip
          - runner: ubuntu-latest
            target: linux-x64
            extension: tar.gz
          - runner: macos-15-intel
            target: macos-x64
            extension: tar.gz
          - runner: macos-15
            target: macos-arm64
            extension: tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - run: just ttyglass-install
      - run: just test-identity-interrupt
      - run: just package
      - run: go run ./cmd/releasepack smoke --archive dist/dovik-v${{ needs.source.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/dovik-v${{ needs.source.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
            dist/dovik-v${{ needs.source.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [source, artifacts]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - uses: actions/download-artifact@v6.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
      - name: Prepare release notes
        shell: bash
        run: |
          awk '/^## \[${{ needs.source.outputs.version }}\]/{capture=1; next} /^## \[/{capture=0} capture' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --target "$GITHUB_SHA"
          --title "Dovik ${{ needs.source.outputs.version }}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          dist/*

  public-verify:
    name: Verify public release (${{ matrix.target }})
    needs: [source, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            extension: zip
          - runner: ubuntu-latest
            target: linux-x64
            extension: tar.gz
          - runner: macos-15-intel
            target: macos-x64
            extension: tar.gz
          - runner: macos-15
            target: macos-arm64
            extension: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - name: Download public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ${{ github.ref_name }} --pattern "dovik-v${{ needs.source.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}*" --dir public-artifacts
      - run: go run ./cmd/releasepack verify --archive public-artifacts/dovik-v${{ needs.source.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
      - name: Verify public archive attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify public-artifacts/dovik-v${{ needs.source.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }} --repo ${{ github.repository }}
      - run: go run ./cmd/releasepack smoke --archive public-artifacts/dovik-v${{ needs.source.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
