name: Scoop release verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Dovik version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify Scoop install
    runs-on: windows-latest
    steps:
      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download release manifest
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://github.com/MrMaxie/dovik/releases/download/v${{ inputs.version }}/dovik.json" -OutFile "$env:RUNNER_TEMP/dovik.json"
      - name: Install, update, and uninstall
        shell: pwsh
        run: |
          scoop install "$env:RUNNER_TEMP/dovik.json"
          if ((dovik --version) -ne "dovik ${{ inputs.version }}") { throw "Dovik version mismatch" }
          if ((dovikd --version) -ne "dovikd ${{ inputs.version }}") { throw "Dovik daemon version mismatch" }
          scoop update dovik
          scoop uninstall dovik
