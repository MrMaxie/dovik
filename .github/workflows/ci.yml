name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            archive: dovik-v1.0.0-windows-x64.zip
          - runner: ubuntu-latest
            target: linux-x64
            archive: dovik-v1.0.0-linux-x64.tar.gz
          - runner: macos-15-intel
            target: macos-x64
            archive: dovik-v1.0.0-macos-x64.tar.gz
          - runner: macos-15
            target: macos-arm64
            archive: dovik-v1.0.0-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - run: just check
      - run: just test-identity-interrupt
      - run: just license-check
      - run: just package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - run: just docs-check

  macos-identity:
    name: Native identity (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: macos-x64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - name: Exercise a separate unprivileged peer
        shell: bash
        run: sudo --preserve-env=PATH env DOVIK_NATIVE_TEST_USER=_www go test -count=1 ./internal/identity

  windows-identity:
    name: Native identity (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - name: Create disposable unprivileged account
        shell: pwsh
        run: |
          $password = "Dv!$([guid]::NewGuid().ToString('N'))aA1"
          Write-Output "::add-mask::$password"
          net user dovik-ci "$password" /add /passwordchg:no
          if ($LASTEXITCODE -ne 0) { throw "Could not create disposable account" }
          "DOVIK_NATIVE_TEST_USERNAME=dovik-ci" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DOVIK_NATIVE_TEST_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Exercise a separate unprivileged peer
        run: go test -count=1 ./internal/identity
      - name: Remove disposable account
        if: always()
        shell: pwsh
        run: net user dovik-ci /delete

  docker:
    name: Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - run: docker version
      - run: just test-linux
      - run: just test-integration
      - run: just test-identity-integration

  podman:
    name: Podman identity integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - run: sudo apt-get update && sudo apt-get install --yes podman
      - run: podman version
      - run: just test-identity-integration
